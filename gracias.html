<style>
:root{--noir:#111110;--panel:#1b1b14;--noir-2:#17170f;--cream:#F3F4E9;--gold:#D4AF37;--gold-2:#e6c766;--wine:#8C1815;--muted:#b7b5a4;--line:rgba(243,244,233,.12);--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,sans-serif;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--noir);color:var(--cream);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.6;background:radial-gradient(120% 80% at 50% -10%,rgba(212,175,55,.12),transparent 55%),radial-gradient(90% 60% at 110% 0%,rgba(140,24,21,.14),transparent 50%)}
.wrap{width:100%;max-width:900px;margin:0 auto;padding:0 24px;position:relative;z-index:2}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:40px}
.brand .bt{font-family:var(--serif);font-size:20px}
.langtog{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12.5px;font-weight:600}
.langtog button{background:none;border:0;color:var(--muted);padding:7px 12px;cursor:pointer;transition:.25s;font-family:var(--sans)}
.langtog button.active{background:var(--gold);color:#20180a}
.hero{text-align:center;padding:clamp(30px,6vw,60px) 0 clamp(20px,3vw,30px)}
.badge{width:70px;height:70px;border-radius:50%;background:rgba(212,175,55,.14);color:var(--gold);display:grid;place-items:center;margin:0 auto 26px;animation:pop .6s var(--ease)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.hero .eyebrow{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:16px}
.hero h1{font-family:var(--serif);font-weight:500;font-size:clamp(32px,5.5vw,52px);line-height:1.06;margin-bottom:18px;letter-spacing:-.01em}
.hero p{color:var(--muted);font-size:clamp(16px,2vw,19px);max-width:52ch;margin:0 auto}
.cal{background:linear-gradient(180deg,var(--panel),var(--noir-2));border:1px solid var(--line);border-radius:22px;padding:12px;margin:34px 0 40px;box-shadow:0 30px 70px -40px rgba(0,0,0,.9)}
.calendly-inline-widget{min-width:280px;height:680px;border-radius:14px;overflow:hidden}
.foot{text-align:center;padding:0 0 50px}
.foot a{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:500;transition:color .25s}
.foot a:hover{color:var(--gold)}
.foot svg{width:16px;height:16px}
@media(max-width:640px){.calendly-inline-widget{height:1000px}}
</style>
</head>

    document.querySelectorAll("[data-k]").forEach(function(el){var d=I18N[el.getAttribute("data-k")];if(d&&d[lang])el.textContent=d[lang];});
    document.querySelectorAll(".langtog button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-lang")===lang);});
  }
  // Calendly URL with prefill from the form + language
  function buildCalUrl(lang){
    var base="https://calendly.com/bookings-granads/30min";
    var qs=[]; var name=params.get("name"), email=params.get("email");
    if(name)qs.push("name="+encodeURIComponent(name));
    if(email)qs.push("email="+encodeURIComponent(email));
    qs.push("hide_gdpr_banner=1");
    return base+(qs.length?("?"+qs.join("&")):"");
  }
  var lang=detectLang();
  var cal=document.querySelector("[data-cal]");
  if(cal)cal.setAttribute("data-url",buildCalUrl(lang));
  applyLang(lang);
  document.querySelectorAll(".langtog button").forEach(function(b){b.addEventListener("click",function(){applyLang(b.getAttribute("data-lang"));});});
})();
</script>
</body>
</html>
